links:
  google_scholar: "https://scholar.google.com/citations?user=nPEtfQIAAAAJ&hl=en"
  github: "https://github.com/lukasztychoniec"
  researchgate: "https://www.researchgate.net/profile/Lukasz-Tychoniec?ev=hdr_xprf"
  orcid: "https://orcid.org/my-orcid?orcid=0000-0002-9470-2358"
  twitter: "https://x.com/ltychoniec"
  linkedin: "https://www.linkedin.com/in/ltychoniec/"
  cv: "papers/cv.pdf" 

# ============================================================
# STEP 3: Site Settings
# ============================================================
accent_color: "#1a7a6d"      # theme color for links and buttons
dark_mode: true              # show dark mode toggle in navbar
description: "Academic webpage of Łukasz Tychoniec, Ph.D. in Astrophysics at Leiden Observatory. Research on star formation, protostellar evolution, and astrochemistry."
baseurl: ""
url: ""

# Google Analytics — paste your GA4 measurement ID, or leave blank
analytics:
  google_id: ""

# ============================================================
# STEP 4: Choose Your Pages (comment out any you don't need)
# ============================================================
nav_pages:
  - name: about
  - name: publications
  #- name: talks
  - name: research
  
  #- name: software
  #- name: team
  #- name: teaching
  - name: blogs

# ============================================================
# Advanced Settings (you probably don't need to change these)
# ============================================================
include:
  - .htaccess
  - _pages

sass:
  quiet_deps: true
  style: compressed

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll/scholar", "jekyll-sitemap"]

scholar:
  last_name: Tychoniec
  first_name: [L.]
  style: citesty
  locale: en
  source: /assets/
  bibliography: "ref.bib"
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bib.html
  details_link: Details
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_bootstrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
  - node_modules
  - package.json
  - package-lock.json
  - docs
